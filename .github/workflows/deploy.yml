name: Dépôt SVP
# À chaque push sur main : zip + archives.xml publiés sur GitHub Pages.
# La version est calculée automatiquement (x.y.<nb commits>), rien à gérer à la main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Construire le dépôt SVP
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          python3 tools/build_depot.py _site "https://${OWNER}.github.io/${REPO}/" \
            "$(git rev-list --count HEAD)" "$(git log -1 --format=%ct)" "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
